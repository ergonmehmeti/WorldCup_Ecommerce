# ─── Block direct IP access ───────────────────────────────────────────────────
# Any request that reaches nginx without a matching server_name (i.e. via IP)
# is caught here and immediately dropped.
server {
    listen 80 default_server;
    listen 443 ssl default_server;

    server_name _;

    # Self-signed cert required for the SSL default_server block;
    # replace with your real cert paths if you have them.
    ssl_certificate     /etc/nginx/ssl/valaboterori.crt;
    ssl_certificate_key /etc/nginx/ssl/valaboterori.key;

    return 444; # Drop connection, no response
}

# ─── Redirect HTTP → HTTPS ────────────────────────────────────────────────────
server {
    listen 80;
    server_name your-domain.example.com;  # 🔒 real domain hidden

    return 301 https://$host$request_uri;
}

# ─── Main HTTPS server ────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    server_name your-domain.example.com;  # 🔒 real domain hidden

    ssl_certificate     /etc/nginx/ssl/valaboterori.crt;
    ssl_certificate_key /etc/nginx/ssl/valaboterori.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # ─── Frontend (static files) ──────────────────────────────────────────────
    root /var/www/valaboterori/frontend/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ─── Backend API ──────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass         http://127.0.0.1:5001;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }
}
